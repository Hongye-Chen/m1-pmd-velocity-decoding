# Frozen GRU input-representation selection protocol.

timing:
  interval_end_lag_ms: 50
  cadence_ms: 10
  histories_ms: [100, 200]
  bin_widths_ms: [10, 20, 50]

targets:
  eligibility_history_ms: 200
  training_samples: 43022
  validation_samples: 8183

architecture:
  num_layers: 1
  hidden_size: 64
  dropout: 0.0

optimization:
  optimizer: adamw
  learning_rate: 0.001
  betas: [0.9, 0.999]
  epsilon: 1.0e-8
  weight_decay: 1.0e-4
  scheduler: none
  loss: mse
  batch_size: 256
  max_epochs: 150
  early_stopping_patience: 15
  early_stopping_min_delta: 1.0e-5
  gradient_clip_norm: 1.0
  data_loader_workers: 0

seeds: [0, 1, 2]

normalization:
  std_floor: 1.0e-8

device:
  deterministic_algorithms: true
  cudnn_benchmark: false
  allow_tf32: false
  cublas_workspace_config: ":4096:8"

selection:
  tie_tolerance: 1.0e-6
